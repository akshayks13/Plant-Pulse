  - control_class: chemical
    ai_id: AI_MYCLOBUTANIL
    title: Triazole
    instructions: Post-infection activity within a short window after a wetting event. DMI resistance
      is documented in some regions.
    priority: 3
    evidence: extension_guideline
  - control_class: cultural
    title: Scab-resistant cultivars
    instructions: Vf-gene cultivars such as Liberty or Enterprise remove the need for a spray programme
