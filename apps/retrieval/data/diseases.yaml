- disease_id: D_BETEL_ANTHRACNOSE
  crop_id: betel
  pathogen_id: P_COLLETOTRICHUM
  common_name: Anthracnose
  curability: manageable
  severity_default: 4
  symptoms: Small water-soaked spots that enlarge into dark brown to black, round or irregular lesions, often with
    a yellow halo and mostly along the leaf margin and tip. Lesions merge, the leaf rots and drops, and dark lesions
    on the stem can make the vine wilt.
  favorable_conditions: Warm humid weather with frequent rain or overhead watering, around 25-30 C, in shaded and
    crowded vines.
  spread_mechanism: Spores are splashed by rain and irrigation water from infected leaves, debris and cuttings.
  look_alikes:
  - D_BETEL_BACTERIAL_SPOT
  treatments:
  - control_class: cultural
    title: Remove infected leaves and open up the vines
    instructions: Pick off and destroy spotted leaves, thin crowded vines for airflow, and water at the base early
      in the day so leaves dry quickly.
    priority: 1
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_MANCOZEB
    title: Protectant fungicide spray
    instructions: 'Spray both leaf surfaces at the first sign of spots and again after heavy rain, as the label
      directs. Betel leaves are chewed fresh: use only a product labelled for betel vine and wait the full pre-harvest
      interval on the label before picking.'
    priority: 2
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_COPPER
    title: Copper fungicide spray
    instructions: 'An alternative protectant; cover the foliage well and do not spray in cool wet spells, when copper
      can scorch leaves. Betel leaves are chewed fresh: use only a product labelled for betel vine and wait the
      full pre-harvest interval on the label before picking.'
    priority: 3
    evidence: extension_guideline
  - control_class: biological
    ai_id: AI_PSEUDOMONAS
    title: Pseudomonas fluorescens bio-spray
    instructions: A biological option that can suppress new leaf infections when applied preventively. It will not
      stop an established outbreak.
    priority: 4
    evidence: extension_guideline
  diy:
  - diy_id: DIY_BETEL_ANTH_BORDEAUX
    title: 1% Bordeaux mixture
    ingredients:
    - item: copper sulphate (blue crystals)
      quantity: 10
      unit: g
      home_available: false
    - item: lime (slaked lime / chuna)
      quantity: 10
      unit: g
      home_available: true
    - item: water for the copper sulphate
      quantity: 500
      unit: ml
      home_available: true
    - item: water for the lime
      quantity: 500
      unit: ml
      home_available: true
    steps: Dissolve 10 g of copper sulphate in 500 ml of water in a plastic, earthen or wooden container, never
      metal. Mix 10 g of lime into another 500 ml of water in a second container. Slowly pour the copper sulphate
      solution into the lime solution while stirring all the time. Dip a polished knife in the mixture for one minute
      and take it out. If the blade has a reddish-brown coating, stir in a little more lime and test again until
      the blade stays clean. Spray both sides of the leaves the same day, because the mixture does not keep.
    prep_time_hours: 0.5
    efficacy: preventive
    feasibility_score: 3
    safety_notes: 'Copper sulphate is poisonous if swallowed and irritates skin and eyes, so wear gloves, keep it
      away from children and pets, and never use kitchen utensils. Do not spray in cool, wet weather, when copper
      can scorch leaves. These leaves are eaten: wash them well and ask your local agriculture office how long to
      wait after spraying before picking.'
