- disease_id: D_PAPAYA_RINGSPOT
  crop_id: papaya
  pathogen_id: P_PRSV
  common_name: Papaya ringspot virus
  curability: incurable
  severity_default: 5
  symptoms: Yellow mosaic and mottling on young leaves, with leaves becoming distorted, puckered and narrow like
    shoestrings. Dark green rings appear on fruit and oily streaks on stems; plants are stunted and the yield collapses.
  favorable_conditions: High aphid activity, often after rains, with infected papaya or cucurbits nearby.
  spread_mechanism: Aphids spread it in a non-persistent way, passing it on within seconds of probing, so insecticides
    cannot stop transmission. Not seed-borne.
  treatments:
  - control_class: cultural
    title: There is no cure - remove infected plants
    instructions: Uproot and destroy infected plants as soon as symptoms appear to remove the source of virus.
    priority: 1
    evidence: extension_guideline
  - control_class: cultural
    title: Start clean and keep away from cucurbits
    instructions: Raise seedlings under insect-proof net, do not plant next to cucumbers, melons or squash, and
      use tolerant varieties where available.
    priority: 2
    evidence: extension_guideline
  - control_class: physical
    title: Barrier crops and aphid monitoring
    instructions: A tall barrier crop such as maize around the plot and yellow sticky traps reduce how many aphids
      land on the papaya.
    priority: 3
    evidence: extension_guideline
