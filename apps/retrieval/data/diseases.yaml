- disease_id: D_HIBISCUS_RUST
  crop_id: hibiscus
  pathogen_id: P_KUEHNEOLA_MALVICOLA
  common_name: Rust
  curability: manageable
  severity_default: 3
  symptoms: Small orange to yellow-brown powdery pustules on the underside of leaves, with matching yellow spots
    on the upper surface. Badly infected leaves turn yellow and fall.
  favorable_conditions: Warm humid weather with long periods of leaf wetness.
  spread_mechanism: Wind-blown and splashed spores from pustules on infected leaves.
  look_alikes:
  - D_HIBISCUS_BLACK_SPOT
  treatments:
  - control_class: cultural
    title: Remove infected leaves early
    instructions: Pick off and bag leaves with pustules as soon as you see them and clear fallen leaves.
    priority: 1
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_PROPICONAZOLE
    title: Triazole fungicide spray
    instructions: A systemic rust fungicide. Rotate with a product from a different group and do not apply it twice
      in a row.
    priority: 2
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_MANCOZEB
    title: Protectant fungicide spray
    instructions: Protects new leaves from fresh infections; use as a rotation partner.
    priority: 3
    evidence: extension_guideline
  diy:
  - diy_id: DIY_HIB_RUST_NEEM
    title: Neem oil spray
    ingredients:
    - item: neem oil
      quantity: 15
      unit: ml
      home_available: false
    - item: soap solution
      quantity: 1
      unit: ml
      home_available: true
    - item: water
      quantity: 1
      unit: L
      home_available: true
    steps: Mix 1 ml of soap solution into a little warm water. Add 15 ml of neem oil and stir hard until the mix
      turns milky. Top it up with water to make 1 litre. Spray both sides of the leaves in the evening. Shake the
