diseases:
- disease_id: D_CORN_GLS
  crop_id: corn
  pathogen_id: P_CERCOSPORA_ZEAE
  common_name: Gray leaf spot (Cercospora leaf spot)
  curability: manageable
  severity_default: 4
  symptoms: Long, narrow, rectangular tan-to-gray lesions running parallel to the leaf veins, with sharply
    defined edges. Starts on lower leaves and moves upward. Lesions coalesce and blight whole leaves.
  favorable_conditions: Prolonged leaf wetness, humidity above 90%, 25-30 C, continuous corn with residue
    left on the surface.
  spread_mechanism: Conidia produced on residue, splashed and wind-blown to lower leaves.
  look_alikes:
  - D_CORN_NLB
  treatments:
  - control_class: cultural
    title: Residue and rotation management
    instructions: Rotate away from corn for at least one season and bury residue. Inoculum is residue-borne,
      so this is the highest-impact control.
    priority: 1
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_AZOXYSTROBIN
    title: QoI strobilurin foliar spray
    instructions: Applied around tasseling if disease reaches the ear leaf. Alternate with a FRAC 3 product;
      do not make back-to-back QoI applications.
    priority: 2
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_PROPICONAZOLE
    title: Triazole foliar spray
    instructions: Rotation partner for the strobilurin.
    priority: 3
    evidence: extension_guideline
- disease_id: D_CORN_NLB
  crop_id: corn
  pathogen_id: P_EXSEROHILUM_TURCICUM
  common_name: Northern leaf blight
  curability: manageable
  severity_default: 4
  symptoms: Large cigar-shaped or elliptical gray-green to tan lesions, 3-15 cm long, with tapered ends.
    Unlike gray leaf spot the lesions cross veins rather than being boxed in by them.
  favorable_conditions: Moderate temperatures 18-27 C with heavy dew or extended wet periods.
  spread_mechanism: Conidia from infected debris, dispersed by wind and rain.
  look_alikes:
  - D_CORN_GLS
  treatments:
  - control_class: cultural
    title: Resistant hybrids and rotation
    instructions: Hybrids carrying Ht resistance genes are the primary control. Rotate and incorporate
      residue.
    priority: 1
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_AZOXYSTROBIN
    title: Strobilurin foliar spray
    instructions: Most useful when applied between tasseling and early silking on susceptible hybrids.
    priority: 2
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_MANCOZEB
    priority: 3
    region: IN
    title: Mancozeb protectant fungicide
    instructions: Mix 2 g/L (TNAU range 2-4 g/L) and apply as a foliar spray when symptoms appear. Mancozeb
      is a protectant, so use it to limit spread rather than as a guaranteed cure.
    dose_value: 2.0
    dose_unit: g/L
    dose_basis: foliar spray
    interval_days: null
    max_applications: null
    phi_days: null
    efficacy_note: TNAU gives mancozeb 2-4 g/L for maize leaf blight.
    evidence: extension_guideline
    label_registered: true
    verified: true
    source_tier: label
    source_name: TNAU Agritech Portal
    source_url: https://agritech.tnau.ac.in/crop_protection/maize_disease_new/maize_2.html
    retrieved_on: '2026-09-04'
- disease_id: D_CORN_RUST
  crop_id: corn
  pathogen_id: P_PUCCINIA_SORGHI
  common_name: Common rust
  curability: manageable
  severity_default: 2
  symptoms: Small cinnamon-brown powdery pustules scattered on both upper and lower leaf surfaces, which
    rupture the epidermis. Rubbing a lesion leaves rusty spores on the finger. Pustules darken to brown-black
    as the season ends.
  favorable_conditions: Cool 16-23 C with high humidity and at least six hours of leaf wetness.
  spread_mechanism: Wind-blown urediniospores arriving from warmer regions; no local overwintering.
  treatments:
  - control_class: cultural
    title: Usually no action needed
    instructions: On field corn this rarely reaches economic thresholds. Confirm severity before recommending
      any spray.
    priority: 1
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_TEBUCONAZOLE
    title: Tebuconazole fungicide
    instructions: Mix 1 ml of tebuconazole per litre of water and apply as a foliar spray only in severe
      or susceptible cases. Rust on field corn often needs no spray, so do not treat chemical control
      as routine.
    priority: 2
    evidence: extension_guideline
    dose_value: 1.0
    dose_unit: ml/L
    dose_basis: foliar spray
    interval_days: null
    max_applications: null
    phi_days: null
    efficacy_note: TNAU lists tebuconazole 1 ml/L for maize common rust (sprays at 35 and 50 DAS).
    label_registered: true
    verified: true
    source_tier: label
    source_name: TNAU Agritech Portal
    source_url: https://agritech.tnau.ac.in/crop_protection/maize_disease_new/maize_4.html
    retrieved_on: '2026-09-04'
- disease_id: D_TOMATO_EARLY_BLIGHT
  crop_id: tomato
  pathogen_id: P_ALTERNARIA_SOLANI
  common_name: Early blight
  curability: manageable
  severity_default: 3
  symptoms: Dark brown spots with concentric rings giving a target or bullseye pattern, surrounded by
    a yellow halo. Begins on the oldest lowest leaves and moves upward. Heavy defoliation exposes fruit
    to sunscald.
  favorable_conditions: Warm 24-29 C, alternating wet and dry periods, plants stressed by poor nutrition
    or heavy fruit load.
  spread_mechanism: Conidia splashed from soil and debris onto lower foliage.
  look_alikes:
  - D_TOMATO_TARGET_SPOT
  - D_TOMATO_SEPTORIA
  treatments:
  - control_class: cultural
    title: Mulch and remove lower leaves
    instructions: Mulch the soil surface to stop rain splash, prune the lowest 30 cm of foliage, water
      at the base and never overhead, and stake for airflow.
    priority: 1
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_MANCOZEB
    title: Protectant contact fungicide
    instructions: Use a mancozeb 75% WP fungicide. Mix 2 g with 1 litre of clean water and stir until
      evenly mixed. Spray tomato foliage evenly for full coverage. This is a protectant, so start early
      rather than waiting for severe disease. TNAU recommends two sprays at a weekly interval.
    priority: 2
    evidence: extension_guideline
    verified: true
    dose_value: 2.0
    dose_unit: g/L
    dose_basis: foliar spray
    interval_days: 7
    max_applications: 2
    phi_days: null
    label_registered: true
    efficacy_note: Protectant fungicide; rotate with a different mode of action.
    source_name: TNAU Agritech Portal
    source_url: https://www.agritech.tnau.ac.in/crop_protection/pdf/2022/CPPS-PSR%20March%202022.pdf
    retrieved_on: '2026-09-04'
    source_tier: label
  - control_class: chemical
    ai_id: AI_CHLOROTHALONIL
    title: Alternative protectant
    instructions: Rotation partner for mancozeb. Verify local registration status before recommending.
    priority: 3
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_DIFENOCONAZOLE
    title: Systemic triazole
    instructions: Has some curative activity on recent infections. Alternate with a multi-site to slow
      resistance.
    priority: 4
    evidence: extension_guideline
  - control_class: biological
    ai_id: AI_BACILLUS_SUBTILIS
    title: Biofungicide
    instructions: Suppressive rather than curative. Suitable for indoor and organic growers on a preventive
      schedule.
    priority: 5
    evidence: peer_reviewed
  diy:
  - diy_id: DIY_TOM_EB_BAKING
    title: Potassium bicarbonate spray
    ingredients:
    - item: potassium bicarbonate
      quantity: null
      unit: g
      home_available: true
    - item: liquid soap as surfactant
      quantity: null
      unit: ml
      home_available: true
    - item: water
      quantity: 1
      unit: L
      home_available: true
    steps: Dissolve fully, add the soap last, spray to run-off on both leaf surfaces in the evening. Reapply
      after rain.
    prep_time_hours: 0.25
    efficacy: preventive
    feasibility_score: 5
    safety_notes: Test on two leaves and wait 48 h before spraying the whole plant. Never spray in direct
      sun.
    evidence: anecdotal
  - diy_id: DIY_TOM_EB_NEEM
    title: Neem oil emulsion
    ingredients:
    - item: cold-pressed neem oil
      quantity: null
      unit: ml
      home_available: true
    - item: mild liquid soap
      quantity: null
      unit: ml
      home_available: true
    - item: water
      quantity: 1
      unit: L
      home_available: true
    steps: Emulsify the oil in warm water with the soap and spray immediately; the emulsion separates
      within hours.
    prep_time_hours: 0.25
    efficacy: preventive
    feasibility_score: 5
    safety_notes: Do not apply within two weeks of a sulfur spray or in temperatures above 32 C.
    evidence: anecdotal
- disease_id: D_TOMATO_LATE_BLIGHT
  crop_id: tomato
  pathogen_id: P_PHYTOPHTHORA_INFESTANS
  common_name: Late blight
  curability: manageable
  severity_default: 5
  symptoms: Large irregular water-soaked greasy grey-green patches on leaves that turn brown and papery,
    often with a pale halo. In humid conditions a fine white mould appears on the leaf underside. Firm
    brown greasy lesions on green fruit. A plant can collapse in under a week.
  favorable_conditions: Cool 10-24 C with sustained high humidity or leaf wetness above 90%.
  spread_mechanism: Airborne sporangia travel long distances; infected tubers and cull piles carry it
    between seasons.
  look_alikes:
  - D_POTATO_LATE_BLIGHT
  treatments:
  - control_class: cultural
    title: Remove and destroy infected plants immediately
    instructions: This spreads faster than any treatment can contain. Bag and dispose of infected plants;
      do not compost. Notify neighbouring growers.
    priority: 1
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_MANCOZEB
    title: Protectant contact fungicide
    instructions: Use mancozeb as a protectant for tomato late blight. Mix 2.5 g with 1 litre of clean
      water, stir well, and spray foliage thoroughly, beginning before the disease becomes severe in cool,
      wet weather. Late blight is an oomycete - do not substitute azoxystrobin or other FRAC 3/11 fungicides.
      Follow the product label for repeat interval and PHI.
    priority: 2
    evidence: extension_guideline
    verified: true
    dose_value: 2.5
    dose_unit: g/L
    dose_basis: foliar spray
    interval_days: 5
    max_applications: null
    phi_days: null
    label_registered: true
    efficacy_note: Multi-site protectant for an oomycete disease; do not rely on single-site chemistry
      alone.
    source_name: TNAU Agritech Portal
    source_url: https://agritech.tnau.ac.in/horticulture/pdf/tech_bulletin/national/IPM-Schedule-for-vegetables.pdf
    retrieved_on: '2026-09-04'
    source_tier: label
  - control_class: chemical
    ai_id: AI_CYMOXANIL
    title: Oomycete-specific with short curative window
    instructions: Effective only within roughly a day or two of infection and only as a pre-mix with a
      protectant.
    priority: 3
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_DIMETHOMORPH
    title: Oomycete-specific systemic
    instructions: Rotation partner. Note that ordinary triazoles and strobilurins have poor activity on
      oomycetes.
    priority: 4
    evidence: extension_guideline
  diy: []
- disease_id: D_TOMATO_SEPTORIA
  crop_id: tomato
  pathogen_id: P_SEPTORIA_LYCOPERSICI
  common_name: Septoria leaf spot
  curability: manageable
  severity_default: 3
  symptoms: Many small circular spots 2-4 mm across with grey or tan centres and dark borders. Tiny black
    fruiting bodies are visible in the centres under a hand lens. Far more numerous and smaller than early
    blight spots, and without concentric rings.
  favorable_conditions: Warm wet weather, 20-25 C, dense canopy with poor airflow.
  spread_mechanism: Splash dispersal from debris and infected lower leaves.
  look_alikes:
  - D_TOMATO_EARLY_BLIGHT
  - D_TOMATO_BACTERIAL_SPOT
  treatments:
  - control_class: cultural
    title: Sanitation and airflow
    instructions: Remove affected lower leaves at first sign, mulch, avoid overhead irrigation, and clear
      all debris at end of season.
    priority: 1
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_CHLOROTHALONIL
    title: Protectant contact fungicide
    instructions: Repeating protectant coverage through the wet period.
    priority: 2
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_MANCOZEB
    title: Mancozeb protectant fungicide (research-suggested rate)
    instructions: A peer-reviewed Indian field study reported spraying tomato with mancozeb at 0.2% against
      Septoria leaf spot. This is a research-suggested rate, not a registered dose - do not present it
      as an India-registered home-use recommendation.
    priority: 3
    evidence: peer_reviewed
    verified: false
    dose_value: 0.2
    dose_unit: '%'
    dose_basis: foliar spray
    interval_days: null
    max_applications: null
    phi_days: null
    label_registered: false
    efficacy_note: A field study reported 0.2% mancozeb effective against Septoria leaf spot (research-suggested,
      not a registered rate).
    source_name: Indian Phytopathology
    source_url: https://epubs.icar.org.in/index.php/IPPJ/article/view/11038
    retrieved_on: '2026-09-04'
    source_tier: research
- disease_id: D_TOMATO_LEAF_MOLD
  crop_id: tomato
  pathogen_id: P_PASSALORA_FULVA
  common_name: Leaf mold
  curability: manageable
  severity_default: 3
  symptoms: Pale green to yellow blotches with indistinct margins on the upper leaf surface, and directly
    beneath each blotch an olive-green to greyish-brown velvety mould on the underside. The underside
    sporulation is diagnostic.
  favorable_conditions: Relative humidity above 85% with temperatures 22-24 C. Almost exclusively a greenhouse
    and polyhouse problem.
  spread_mechanism: Airborne conidia; survives on structures, stakes and debris between crops.
  treatments:
  - control_class: cultural
    title: Lower the humidity
    instructions: This is the control that actually works indoors. Increase ventilation, space plants
      wider, prune lower foliage, avoid evening watering, and heat plus vent to prevent condensation.
    priority: 1
    evidence: extension_guideline
  - control_class: physical
    title: Structure sanitation
    instructions: Disinfect stakes, trellises and greenhouse surfaces between crops; conidia persist on
      them.
    priority: 2
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_CHLOROTHALONIL
    title: Protectant fungicide
    instructions: Secondary to humidity management. Verify indoor/greenhouse registration before recommending.
    priority: 3
    evidence: extension_guideline
- disease_id: D_TOMATO_TARGET_SPOT
  crop_id: tomato
  pathogen_id: P_CORYNESPORA_CASSIICOLA
  common_name: Target spot
  curability: manageable
  severity_default: 3
  symptoms: Small brown lesions that expand into light brown spots with faint concentric rings and a subtle
    yellow halo. Also lesions on stems and sunken pitted spots on fruit, which early blight rarely produces.
  favorable_conditions: Warm humid conditions with extended leaf wetness.
  spread_mechanism: Conidia spread by wind and splash; wide alternate host range.
  look_alikes:
  - D_TOMATO_EARLY_BLIGHT
  treatments:
  - control_class: cultural
    title: Canopy and debris management
    instructions: Improve airflow, remove infected debris, avoid overhead irrigation.
    priority: 1
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_CHLOROTHALONIL
    title: Protectant fungicide
    instructions: Repeating protectant programme; rotate with a different FRAC group.
    priority: 2
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_AZOXYSTROBIN
    title: Strobilurin
    instructions: Documented resistance in this pathogen in some regions. Do not use alone or repeatedly.
    priority: 3
    evidence: extension_guideline
- disease_id: D_TOMATO_BACTERIAL_SPOT
  crop_id: tomato
  pathogen_id: P_XANTHOMONAS_TOMATO
  common_name: Bacterial spot
  curability: manageable
  severity_default: 4
  symptoms: Small dark water-soaked spots that become angular and brown-black, often with a narrow yellow
    margin, and which may drop out leaving a shot-hole. Raised scabby lesions on fruit. Bacterial spots
    look greasy and angular; fungal spots look dry and round.
  favorable_conditions: Warm 24-30 C with driving rain, overhead irrigation or high humidity; spreads
    through wounds from handling.
  spread_mechanism: Contaminated seed and transplants; splash and mechanical transfer on hands and tools.
  look_alikes:
  - D_TOMATO_SEPTORIA
  treatments:
  - control_class: cultural
    title: Clean seed and no-touch discipline
    instructions: Start from certified or hot-water-treated seed. Never work among wet plants. Remove
      and destroy infected plants at first detection.
    priority: 1
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_COPPER
    title: Copper bactericide
    instructions: Use copper oxychloride at 2 g per litre of clean water as a suppressive spray only.
      Copper does not cure an established bacterial infection - it slows spread. Use clean seed or transplants,
      remove badly affected material, and avoid splashing water from infected plants. No fungicide acts
      on this bacterium.
    priority: 2
    evidence: extension_guideline
    verified: true
    dose_value: 2.0
    dose_unit: g/L
    dose_basis: foliar spray
    interval_days: null
    max_applications: null
    phi_days: null
    label_registered: true
    efficacy_note: Suppressive only, not curative; copper-tolerant strains are widespread.
    source_name: TNAU Agritech Portal
    source_url: https://agritech.tnau.ac.in/horticulture/pdf/tech_bulletin/national/IPM-Schedule-for-vegetables.pdf
    retrieved_on: '2026-09-04'
    source_tier: label
- disease_id: D_TOMATO_TYLCV
  crop_id: tomato
  pathogen_id: P_TYLCV
  common_name: Tomato yellow leaf curl virus
  curability: incurable
  severity_default: 5
  symptoms: Severe upward cupping and curling of leaves, marked yellowing of leaf margins, drastically
    reduced leaf size, stunted bushy growth and flower drop. Plants infected early set almost no fruit.
  favorable_conditions: High whitefly populations, warm dry weather.
  spread_mechanism: Transmitted persistently by the silverleaf whitefly. Not seed-borne, not mechanically
    transmitted.
  treatments:
  - control_class: cultural
    title: There is no cure - remove the plant
    instructions: An infected plant cannot recover and acts as a reservoir for whiteflies to spread the
      virus. Bag and remove it. Do not sell a chemical against the virus itself.
    priority: 1
    evidence: extension_guideline
  - control_class: physical
    title: Whitefly exclusion and monitoring
    instructions: Insect-proof mesh on vents, yellow sticky traps, reflective mulch, and inspection of
      leaf undersides. This is the entire preventive programme.
    priority: 2
    evidence: extension_guideline
  - control_class: biological
    ai_id: AI_AZADIRACHTIN
    title: Neem-based whitefly suppression
    instructions: Reduces vector pressure on nearby healthy plants. Has no effect on an already infected
      plant.
    priority: 3
    evidence: extension_guideline
  - control_class: cultural
    title: Resistant varieties
    instructions: Ty-gene tolerant cultivars are the only durable answer for a repeat problem.
    priority: 4
    evidence: extension_guideline
- disease_id: D_TOMATO_MOSAIC_VIRUS
  crop_id: tomato
  pathogen_id: P_TOMV
  common_name: Tomato mosaic virus
  curability: incurable
  severity_default: 4
  symptoms: Light and dark green mottled mosaic patterning on leaves, sometimes with fern-like narrowing
    or distortion of young leaves, and internal browning of fruit. Symptoms are often mistaken for nutrient
    deficiency or herbicide drift.
  favorable_conditions: Any conditions. Spread depends on handling, not weather.
  spread_mechanism: Mechanical only - hands, tools, clothing, seed and plant debris. The virus is exceptionally
    stable and survives for years on dry surfaces.
  treatments:
  - control_class: cultural
    title: There is no cure - remove and sanitise
    instructions: Remove infected plants. Wash hands with soap and disinfect tools between plants. Anyone
      handling tobacco must wash first, as the virus survives in cured tobacco.
    priority: 1
    evidence: extension_guideline
  - control_class: cultural
    title: Seed and resistant varieties
    instructions: Use certified seed and Tm-2a resistant cultivars on replant.
    priority: 2
    evidence: extension_guideline
- disease_id: D_TOMATO_SPIDER_MITES
  crop_id: tomato
  pathogen_id: P_TETRANYCHUS_URTICAE
  common_name: Two-spotted spider mite infestation
  curability: curable
  severity_default: 3
  symptoms: Fine pale stippling or speckling across the upper leaf surface, leaves turning bronze then
    dry and brittle, and fine webbing on the leaf underside and between stems in heavy infestations. Tiny
    moving specks are visible on the underside with a hand lens.
  favorable_conditions: Hot dry conditions with low humidity and dusty foliage. Indoor and greenhouse
    plants are especially prone.
  spread_mechanism: Crawling, wind dispersal, and transfer on clothing and infested plants.
  treatments:
  - control_class: physical
    title: Water spray and humidity
    instructions: A forceful water spray to the leaf underside every two to three days physically removes
      mites and raises humidity, which suppresses them. Cheapest effective first step indoors.
    priority: 1
    evidence: extension_guideline
  - control_class: biological
    ai_id: AI_PREDATORY_MITES
    title: Predatory mites
    instructions: Phytoseiulus persimilis or Amblyseius californicus give durable control in enclosed
      spaces and cannot develop resistance.
    priority: 2
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_HORT_OIL
    title: Horticultural or neem oil
    instructions: Contact action; requires thorough coverage of leaf undersides and repeat applications
      to catch newly hatched mites.
    priority: 3
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_ABAMECTIN
    title: Acaricide
    instructions: Rotate IRAC groups every generation. This is a mite, not a fungus - a fungicide will
      not touch it, and some fungicides actually flare mite populations by killing their natural enemies.
    priority: 4
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_SPIROMESIFEN
    title: Acaricide rotation partner
    instructions: Different IRAC group; strong on eggs and juveniles.
    priority: 5
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_FENAZAQUIN
    title: AI_FENAZAQUIN treatment
    priority: 4
    region: IN
    verified: true
    dose_value: 2.5
    dose_unit: ml/L
    dose_basis: foliar spray
    interval_days: null
    max_applications: null
    phi_days: 7
    label_registered: true
    evidence: extension_guideline
    efficacy_note: Acaricide, IRAC group 21A. Rotate mite-control modes of action every generation.
    source_name: TNAU Agritech Portal
    source_url: https://agritech.tnau.ac.in/crop_protection/tomato/tomato_5.html
    retrieved_on: '2026-09-04'
    instructions: Use fenazaquin 10 EC for two-spotted spider mites. Mix 2.5 ml with 1 litre of clean
      water and spray evenly, concentrating on leaves where mites are present. This is an acaricide, not
      a fungicide - a fungicide will not touch mites. Do not repeat the same chemistry continuously; rotate
      IRAC groups.
    source_tier: label
  diy:
  - diy_id: DIY_MITE_SOAP
    title: Insecticidal soap spray
    ingredients:
    - item: pure liquid soap (not detergent)
      quantity: null
      unit: ml
      home_available: true
    - item: water
      quantity: 1
      unit: L
      home_available: true
    steps: Mix and spray the leaf underside to run-off. Repeat every 3-5 days for at least three rounds
      to break the life cycle.
    prep_time_hours: 0.1
    efficacy: mild_curative
    feasibility_score: 5
    safety_notes: Detergents and dish soaps with degreasers will burn foliage. Spot-test first.
    evidence: extension_guideline
- disease_id: D_POTATO_EARLY_BLIGHT
  crop_id: potato
  pathogen_id: P_ALTERNARIA_SOLANI
  common_name: Early blight
  curability: manageable
  severity_default: 3
  symptoms: Dark brown angular lesions with concentric rings, often bounded by leaf veins, with a yellow
    halo. Starts on the oldest lower leaves.
  favorable_conditions: Warm weather with alternating wet and dry cycles; nitrogen-stressed or senescing
    plants are far more susceptible.
  spread_mechanism: Conidia from soil and debris, splashed onto lower foliage.
  look_alikes:
  - D_POTATO_LATE_BLIGHT
  treatments:
  - control_class: cultural
    title: Nutrition and residue
    instructions: Maintain adequate nitrogen through tuber bulking; deficient plants senesce early and
      are colonised readily. Remove debris and rotate.
    priority: 1
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_MANCOZEB
    title: Protectant contact fungicide
    instructions: Use mancozeb for potato early blight. Mix 2 g with 1 litre of clean water, stir well,
      and spray foliage thoroughly. TNAU recommends sprays at 45, 60 and 75 days after planting (about
      15-day intervals). Follow the product label for the harvest waiting period.
    priority: 2
    evidence: extension_guideline
    verified: true
    dose_value: 2.0
    dose_unit: g/L
    dose_basis: foliar spray
    interval_days: 15
    max_applications: 3
    phi_days: null
    label_registered: true
    efficacy_note: Protectant fungicide.
    source_name: TNAU Agritech Portal
