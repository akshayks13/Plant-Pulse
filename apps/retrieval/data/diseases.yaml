- disease_id: D_BETEL_BACTERIAL_SPOT
  crop_id: betel
  pathogen_id: P_XANTHOMONAS_BETLICOLA
  common_name: Bacterial leaf spot
  curability: manageable
  severity_default: 4
  symptoms: Small water-soaked spots that turn brown to black, angular because the veins limit them, with a bright
    yellow halo. Spots merge into large dead patches; in humid weather leaves drop and stem lesions make the vine
    wilt.
  favorable_conditions: Rainy season, high humidity and warm temperatures, plus wounds from handling or insects.
  spread_mechanism: Rain splash, irrigation water, contaminated cuttings, knives and hands.
  look_alikes:
  - D_BETEL_ANTHRACNOSE
  treatments:
  - control_class: cultural
    title: Sanitation and clean planting material
    instructions: Remove and destroy infected leaves and vines, take cuttings only from healthy vines, disinfect
      knives, and avoid working among the vines while they are wet.
    priority: 1
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_COPPER
    title: Copper bactericide spray
    instructions: 'Copper is the only widely available spray with activity on bacteria. It protects healthy leaves
      but does not cure spotted ones. Betel leaves are chewed fresh: use only a product labelled for betel vine
      and wait the full pre-harvest interval on the label before picking.'
    priority: 2
    evidence: extension_guideline
  - control_class: biological
    ai_id: AI_PSEUDOMONAS
    title: Pseudomonas fluorescens preventive spray
    instructions: Can reduce new infections when used before the rainy season. Not a cure for spotted leaves.
    priority: 3
    evidence: extension_guideline
  diy:
  - diy_id: DIY_BETEL_BACT_BORDEAUX
    title: 1% Bordeaux mixture
    ingredients:
    - item: copper sulphate (blue crystals)
      quantity: 10
      unit: g
      home_available: false
    - item: lime (slaked lime / chuna)
      quantity: 10
      unit: g
      home_available: true
    - item: water for the copper sulphate
      quantity: 500
      unit: ml
      home_available: true
    - item: water for the lime
      quantity: 500
      unit: ml
      home_available: true
    steps: Dissolve 10 g of copper sulphate in 500 ml of water in a plastic, earthen or wooden container, never
      metal. Mix 10 g of lime into another 500 ml of water in a second container. Slowly pour the copper sulphate
      solution into the lime solution while stirring all the time. Dip a polished knife in the mixture for one minute
      and take it out. If the blade has a reddish-brown coating, stir in a little more lime and test again until
      the blade stays clean. Spray both sides of the leaves the same day, because the mixture does not keep.
    prep_time_hours: 0.5
