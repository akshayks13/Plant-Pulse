- disease_id: D_HIBISCUS_YVM
  crop_id: hibiscus
  pathogen_id: P_HIBISCUS_YVM
  common_name: Yellow vein mosaic
  curability: incurable
  severity_default: 4
  symptoms: Bright yellow netting along the veins of young leaves that spreads into a yellow mosaic. Leaves may
    become smaller and curl, and the plant flowers poorly.
  favorable_conditions: High whitefly populations in warm, dry weather, with infected okra, cotton or malvaceous
    weeds nearby.
  spread_mechanism: Transmitted by the whitefly Bemisia tabaci and carried in cuttings or grafts from infected plants.
    Not spread by touch or seed.
  treatments:
  - control_class: cultural
    title: There is no cure - remove the plant
    instructions: An infected plant cannot recover and is a source of virus for whiteflies. Remove and bag it, and
      never take cuttings from it.
    priority: 1
    evidence: extension_guideline
  - control_class: physical
    title: Whitefly monitoring and exclusion
    instructions: Use yellow sticky traps, check leaf undersides regularly, and remove malvaceous weeds nearby.
    priority: 2
    evidence: extension_guideline
  - control_class: biological
    ai_id: AI_AZADIRACHTIN
    title: Neem-based whitefly suppression
    instructions: Reduces whitefly numbers on nearby healthy plants. It has no effect on an already infected plant.
    priority: 3
    evidence: extension_guideline
