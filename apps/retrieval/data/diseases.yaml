  - control_class: chemical
    ai_id: AI_AZOXYSTROBIN
    title: Strobilurin
    instructions: Resistance is documented in A. solani. Alternate with a multi-site, never apply consecutively.
    priority: 3
    evidence: extension_guideline
- disease_id: D_POTATO_LATE_BLIGHT
  crop_id: potato
  pathogen_id: P_PHYTOPHTHORA_INFESTANS
  common_name: Late blight
  curability: manageable
  severity_default: 5
  symptoms: Water-soaked grey-green lesions expanding rapidly to brown-black, with a white fuzzy sporulating
    ring on the leaf underside in humid conditions. Stems develop dark lesions. Tubers show reddish-brown
    granular rot beneath the skin.
  favorable_conditions: Cool 10-20 C with prolonged high humidity, fog or rain.
  spread_mechanism: Airborne sporangia over long distances; infected seed tubers and cull piles carry
    it over.
  look_alikes:
  - D_POTATO_EARLY_BLIGHT
  - D_TOMATO_LATE_BLIGHT
  treatments:
  - control_class: cultural
    title: Destroy infected foliage and cull piles
    instructions: Remove volunteers and cull piles. Hill soil well over tubers to block spore washdown.
      Kill the haulm before harvest if blight is present.
    priority: 1
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_MANCOZEB
    title: Protectant contact fungicide
    instructions: Use mancozeb as a protectant for potato late blight. Mix 2 g with 1 litre of clean water,
      stir, and cover foliage well. Late blight is an oomycete - do not substitute FRAC 3 or FRAC 11 fungicides.
      Use a metalaxyl-containing pre-mix only when the exact registered product is confirmed.
    priority: 2
    evidence: extension_guideline
    verified: true
    dose_value: 2.0
    dose_unit: g/L
    dose_basis: foliar spray
    interval_days: 15
    max_applications: 3
    phi_days: null
    label_registered: true
    efficacy_note: Multi-site protectant; late blight is an oomycete.
    source_name: TNAU Agritech Portal
    source_url: https://agritech.tnau.ac.in/horticulture/horti_vegetables_potato.html
    retrieved_on: '2026-09-04'
    source_tier: label
  - control_class: chemical
    ai_id: AI_DIMETHOMORPH
    title: Oomycete-specific systemic
    instructions: Use in alternation with a multi-site protectant.
    priority: 3
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_METALAXYL
    title: Phenylamide
    instructions: Only as a pre-mix and only where local strains are not resistant. Phenylamide resistance
      is common.
    priority: 4
    evidence: extension_guideline
- disease_id: D_PEPPER_BACTERIAL_SPOT
  crop_id: pepper_bell
  pathogen_id: P_XANTHOMONAS_PEPPER
  common_name: Bacterial spot
  curability: manageable
  severity_default: 4
  symptoms: Small water-soaked spots on leaf undersides becoming brown and angular with a yellow halo,
    often with a shot-hole appearance. Raised scabby corky lesions on fruit. Severe defoliation follows.
  favorable_conditions: Warm 24-30 C with rain, overhead irrigation or high humidity.
  spread_mechanism: Contaminated seed and transplants; splash and handling.
  treatments:
  - control_class: cultural
    title: Clean seed
    sanitation: null
    resistant varieties: null
    instructions: Certified or hot-water-treated seed, three-year rotation, and never handling wet plants.
      Bacterial-spot-resistant pepper cultivars exist and are the durable answer.
    priority: 1
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_COPPER
    title: Copper acetate seed treatment (research-suggested, preventive only)
    instructions: This is a preventive seed treatment only and does nothing for an existing bacterial-spot
      infection on a diseased plant. A peer-reviewed study reported 0.2% copper acetate as a seed treatment
      for pepper bacterial spot - a research-suggested rate, not a registered foliar dose.
    priority: 5
    evidence: peer_reviewed
    dose_value: 0.2
    dose_unit: '%'
    dose_basis: seed treatment
    interval_days: null
    max_applications: null
    phi_days: null
    efficacy_note: Preventive seed treatment only; not useful against an existing plant infection.
    label_registered: false
    verified: false
    source_tier: research
    source_name: Erciyes University (peer-reviewed pepper bacterial spot study)
    source_url: https://avesis.erciyes.edu.tr/yayin/b0fb904d-c12c-4729-a3b5-2ec86fa7bcb7/identification-of-xanthomonas-spp-disease-agent-s-and-the-effect-of-chemical-seed-treatments-to-control-bacterial-spot-of-pepper
    retrieved_on: '2026-09-04'
- disease_id: D_STRAWBERRY_LEAF_SCORCH
  crop_id: strawberry
  pathogen_id: P_DIPLOCARPON_EARLIANUM
  common_name: Leaf scorch
  curability: manageable
  severity_default: 3
  symptoms: Numerous small irregular dark purple spots without the pale centre seen in common leaf spot.
    Spots merge until the leaf looks scorched or burnt, with the margins curling upward.
  favorable_conditions: Warm wet weather with extended leaf wetness and dense crowded plantings.
  spread_mechanism: Conidia splashed from infected leaf debris in the crown.
  treatments:
  - control_class: cultural
    title: Renovation and spacing
    instructions: Remove and destroy old infected foliage after harvest, thin runners for airflow, and
      irrigate at the base rather than overhead.
    priority: 1
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_CAPTAN
    title: Protectant fungicide
    instructions: Protectant applications through the wet season.
    priority: 2
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_MYCLOBUTANIL
    title: Triazole
    instructions: Rotation partner with systemic activity.
    priority: 3
    evidence: extension_guideline
- disease_id: D_ORANGE_HLB
  crop_id: orange
  pathogen_id: P_CLAS
  common_name: Huanglongbing (citrus greening)
  curability: incurable
  severity_default: 5
  symptoms: Blotchy asymmetric yellow mottling that does not mirror across the midrib - this asymmetry
    distinguishes it from a nutrient deficiency, which is symmetric. Yellow shoots, corky enlarged veins,
    small lopsided fruit that stay green at the bottom, bitter juice and heavy premature fruit drop.
  favorable_conditions: Presence of the Asian citrus psyllid. The tree declines regardless of weather
    once infected.
  spread_mechanism: Transmitted by the Asian citrus psyllid and by grafting infected budwood. Systemic
    and permanent.
  treatments:
  - control_class: cultural
    title: Report it - do not attempt home treatment
    instructions: There is no cure and no chemical will save an infected tree. HLB is regulated in many
      jurisdictions. Report a suspected case to the local agriculture department or horticulture officer
      and follow their instructions on removal.
    priority: 1
    evidence: extension_guideline
  - control_class: cultural
    title: Certified disease-free planting material
    instructions: Only plant nursery stock certified free of the pathogen. Grafting is a major transmission
      route.
    priority: 2
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_IMIDACLOPRID
    title: Psyllid vector suppression
    instructions: Area-wide vector management protects uninfected trees only. It does not treat an infected
      tree, and pollinator restrictions apply.
    priority: 3
    evidence: extension_guideline
- disease_id: D_GRAPE_BLACK_ROT
  crop_id: grape
  pathogen_id: P_GUIGNARDIA_BIDWELLII
  common_name: Black rot
  curability: manageable
  severity_default: 4
  symptoms: Circular tan leaf lesions with a dark border and a ring of tiny black pycnidia inside the
    spot. Berries develop a pale spot that rots the whole fruit within days, turning it into a hard black
    shrivelled mummy that clings to the cluster.
  favorable_conditions: Warm 20-27 C with rain; infection needs several hours of wetness.
  spread_mechanism: Ascospores and conidia released from overwintered mummies and cane lesions during
    spring rain.
  treatments:
  - control_class: cultural
    title: Remove mummies
    instructions: Every mummified berry left on the vine or ground is next season's inoculum. Removing
      them in winter is the single highest-value action.
    priority: 1
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_MANCOZEB
    title: Protectant fungicide
    instructions: Critical window runs from shoot growth through several weeks after bloom, when berries
      are susceptible.
    priority: 2
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_MYCLOBUTANIL
    title: Triazole
    instructions: Systemic with post-infection activity within a short window.
    priority: 3
    evidence: extension_guideline
- disease_id: D_GRAPE_ESCA
  crop_id: grape
  pathogen_id: P_ESCA_COMPLEX
  common_name: Esca (black measles)
  curability: incurable
  severity_default: 5
  symptoms: Tiger-stripe pattern on leaves - interveinal yellow or red chlorotic bands that dry to brown
    between green veins. Small dark spots on berries. In the apoplectic form an entire vine wilts and
    dies within days in hot weather. Cut trunk wood shows dark streaking and a spongy white rot.
  favorable_conditions: Large pruning wounds made in wet weather; older vines are far more affected.
  spread_mechanism: Spores enter through pruning wounds and colonise permanent trunk wood over years.
  treatments:
  - control_class: cultural
    title: No chemical cure exists - manage wounds
    instructions: The pathogens live in the trunk where no foliar spray reaches. Prune late in the dormant
      season during dry weather, make small cuts, and seal or treat large wounds. Remove and burn dead
      vines.
    priority: 1
    evidence: extension_guideline
  - control_class: biological
    ai_id: AI_TRICHODERMA
    title: Pruning wound protectant
    instructions: Applied to fresh cuts to competitively exclude trunk pathogens. Preventive only, on
      healthy wood.
    priority: 2
    evidence: peer_reviewed
  - control_class: physical
    title: Trunk renewal surgery
    instructions: Cutting back to clean wood and retraining a new trunk can prolong a valuable vine. Skilled
      work, not a home remedy.
    priority: 3
    evidence: extension_guideline
- disease_id: D_GRAPE_LEAF_BLIGHT
  crop_id: grape
  pathogen_id: P_PSEUDOCERCOSPORA_VITIS
  common_name: Leaf blight (Isariopsis leaf spot)
  curability: manageable
  severity_default: 3
  symptoms: Irregular dark brown to black angular spots on leaves, often merging into large blighted areas,
    with a sooty growth visible on the underside. Heavy infection causes premature leaf drop, weakening
    the vine for next season.
  favorable_conditions: Warm humid weather late in the season with a dense shaded canopy.
  spread_mechanism: Conidia from overwintered fallen leaves and canes.
  treatments:
  - control_class: cultural
    title: Canopy management and leaf removal
    instructions: Open the canopy for airflow and light penetration, and clear fallen leaves at the end
      of the season.
    priority: 1
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_MANCOZEB
    title: Protectant fungicide
    instructions: Late-season protectant coverage; often controlled incidentally by the black rot programme.
    priority: 2
    evidence: extension_guideline
- disease_id: D_APPLE_SCAB
  crop_id: apple
  pathogen_id: P_VENTURIA_INAEQUALIS
  common_name: Apple scab
  curability: manageable
  severity_default: 4
  symptoms: Olive-green velvety spots with feathery indistinct margins on leaves, which darken and turn
    the leaf yellow before it drops. Corky brown scabby lesions on fruit that crack as the fruit expands.
  favorable_conditions: Cool wet spring weather. Infection is driven by hours of leaf wetness at a given
    temperature (the Mills periods).
  spread_mechanism: Ascospores discharged from fallen leaves during spring rain, then secondary conidia
    through the season.
  treatments:
  - control_class: cultural
    title: Destroy fallen leaves
    instructions: Rake and remove or shred fallen leaves in autumn. Removing the overwintering leaf litter
      directly reduces the spring ascospore load.
    priority: 1
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_CAPTAN
    title: Protectant fungicide
    instructions: Applied on a schedule through the primary infection period from green tip to petal fall.
    priority: 2
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_MYCLOBUTANIL
    title: Triazole
    instructions: Post-infection activity within a short window after a wetting event. DMI resistance
      is documented in some regions.
    priority: 3
    evidence: extension_guideline
  - control_class: cultural
    title: Scab-resistant cultivars
    instructions: Vf-gene cultivars such as Liberty or Enterprise remove the need for a spray programme
      entirely on a new planting.
    priority: 4
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_MANCOZEB
    priority: 3
    region: IN
    title: Mancozeb protectant fungicide
    instructions: Use mancozeb at 0.25% as a foliar spray at the bearing stage, as specified by TNAU.
      It is a protectant intended to prevent or limit scab rather than cure it.
    dose_value: 0.25
    dose_unit: '%'
    dose_basis: foliar spray
    interval_days: null
    max_applications: null
    phi_days: null
    efficacy_note: TNAU recommends mancozeb 0.25% for apple scab.
    evidence: extension_guideline
    label_registered: true
    verified: true
    source_tier: label
    source_name: TNAU Agritech Portal
    source_url: https://agritech.tnau.ac.in/crop_protection/apple_1.html
    retrieved_on: '2026-09-04'
- disease_id: D_APPLE_BLACK_ROT
  crop_id: apple
  pathogen_id: P_BOTRYOSPHAERIA_OBTUSA
  common_name: Black rot (frogeye leaf spot)
  curability: manageable
  severity_default: 3
  symptoms: Round leaf spots with purple margins and tan centres, giving the frogeye appearance. On fruit,
    a firm brown rot with concentric rings, usually starting at the calyx end. Sunken cankers with rough
    cracked bark on limbs.
  favorable_conditions: Warm humid weather; infection enters through wounds and dead or winter-injured
    wood.
  spread_mechanism: Spores from cankers and mummified fruit dispersed by rain.
  treatments:
  - control_class: cultural
    title: Prune out cankers and dead wood
    instructions: The fungus lives in dead wood. Remove cankered limbs and mummified fruit and destroy
      them; sanitation matters more here than spraying.
    priority: 1
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_CAPTAN
    title: Protectant fungicide
    instructions: Usually covered by the scab programme; supplementary cover sprays in wet summers.
    priority: 2
    evidence: extension_guideline
- disease_id: D_APPLE_CEDAR_RUST
  crop_id: apple
  pathogen_id: P_GYMNOSPORANGIUM_JV
  common_name: Cedar apple rust
  curability: manageable
  severity_default: 3
  symptoms: Bright yellow-orange spots on the upper leaf surface, often with a red border, developing
    small black dots in the centre. Beneath the spot, tube- like or hairy fringed structures protrude
    from the leaf underside - these are diagnostic and appear in no other apple disease.
  favorable_conditions: Spring rain, with a juniper or eastern red cedar host within a few hundred metres.
  spread_mechanism: Requires two hosts. Spores move from gelatinous orange galls on juniper to apple in
    spring, and back to juniper later.
  treatments:
  - control_class: cultural
    title: Remove nearby junipers
    instructions: The fungus cannot complete its life cycle without a juniper host. Removing junipers
      within a few hundred metres, or removing the orange galls before they swell in spring, ends the
      problem permanently.
    priority: 1
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_MYCLOBUTANIL
    title: Triazole
    instructions: Applied during the spring spore release window from pink bud through to a few weeks
      after petal fall. Later sprays are wasted.
    priority: 2
    evidence: extension_guideline
- disease_id: D_PEACH_BACTERIAL_SPOT
  crop_id: peach
  pathogen_id: P_XANTHOMONAS_PRUNI
  common_name: Bacterial spot
  curability: manageable
  severity_default: 4
  symptoms: Small angular purple-black leaf spots bounded by veins, whose centres often fall out to leave
    a ragged shot-hole. Heavy defoliation. Sunken pitted or cracked lesions on fruit skin.
  favorable_conditions: Warm wet windy weather; sandy exposed sites and wind-driven sand injury make it
    much worse.
  spread_mechanism: Overwinters in twig cankers and buds; spread by wind-driven rain.
  treatments:
  - control_class: cultural
    title: Site
    windbreaks and tolerant cultivars: null
    instructions: Cultivar tolerance varies enormously and is the main lever. Windbreaks reduce the leaf
      abrasion that lets bacteria in. Avoid excessive nitrogen.
    priority: 1
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_COPPER
    title: Dormant copper application
    instructions: Copper is used mainly in the dormant or delayed-dormant window; peach foliage is copper-sensitive
      and in-season applications risk phytotoxicity.
    priority: 2
    evidence: extension_guideline
- disease_id: D_CHERRY_POWDERY_MILDEW
  crop_id: cherry
  pathogen_id: P_PODOSPHAERA_CLANDESTINA
  common_name: Powdery mildew
  curability: curable
  severity_default: 3
  symptoms: White powdery patches on leaves, first on the underside and on succulent new shoots, with
    leaf curling and distortion. White fuzz on fruit and pedicels near harvest.
  favorable_conditions: Warm dry days with humid nights. Unlike most foliar fungi it does not need free
    water on the leaf, and rain actually suppresses it.
  spread_mechanism: Airborne conidia; overwinters as chasmothecia on bark and in bud scales.
  treatments:
  - control_class: cultural
    title: Prune for light and airflow
    instructions: Open the canopy, avoid excessive nitrogen that pushes soft susceptible growth, and remove
      infected suckers and watersprouts.
    priority: 1
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_SULFUR
    title: Sulfur
    instructions: Effective and inexpensive. Do not apply above roughly 30 C or within two weeks of an
      oil spray - both cause severe phytotoxicity.
    priority: 2
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_MYCLOBUTANIL
    title: Triazole
    instructions: Systemic; rotate FRAC groups, as powdery mildews develop resistance readily.
    priority: 3
    evidence: extension_guideline
- disease_id: D_SQUASH_POWDERY_MILDEW
  crop_id: squash
  pathogen_id: P_PODOSPHAERA_XANTHII
  common_name: Powdery mildew
  curability: curable
  severity_default: 3
  symptoms: White talcum-like circular patches on the upper leaf surface that spread to cover the whole
    leaf, which then yellows, browns and dies. Stems and petioles are affected; fruit usually is not,
    but loses quality from the loss of canopy. The white growth wipes off with a finger - this rules out
    a lookalike leaf marking such as silver variegation.
  favorable_conditions: Moderate 20-27 C with high humidity but dry leaf surfaces, and shaded crowded
    canopies.
  spread_mechanism: Windborne conidia; needs no free water to germinate.
  treatments:
  - control_class: cultural
    title: Spacing
    resistant varieties and leaf removal: null
    instructions: Space plants for airflow, plant in full sun, choose resistant cultivars, and remove
      the worst affected lower leaves early.
    priority: 1
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_POTASSIUM_BICARB
    title: Potassium bicarbonate
    instructions: One of the few genuinely eradicant options - it collapses existing colonies on contact,
      not just prevents new ones.
    priority: 2
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_SULFUR
    title: Wettable sulfur protectant fungicide (research-suggested rate)
    instructions: The 0.2% wettable sulfur rate comes from a TNAU cucurbit page for watermelon, not a
      squash-specific registration - treat it as a research-suggested rate, not a verified squash dose.
      Do not apply sulfur in excessive heat because of phytotoxicity risk.
    priority: 4
    evidence: peer_reviewed
    dose_value: 0.2
    dose_unit: '%'
    dose_basis: foliar spray
    interval_days: null
    max_applications: null
    phi_days: null
    efficacy_note: 0.2% wettable sulfur from a TNAU watermelon/cucurbit page; squash-specific verification
      absent.
    label_registered: false
    verified: false
    source_tier: research
    source_name: TNAU Agritech Portal
    source_url: https://agritech.tnau.ac.in/crop_protection/water_melon_6.html
    retrieved_on: '2026-09-04'
  - control_class: biological
    ai_id: AI_BACILLUS_SUBTILIS
    title: Biofungicide
    instructions: Preventive and suppressive; useful in a rotation to reduce resistance pressure on the
      synthetics.
    priority: 4
    evidence: peer_reviewed
  - control_class: chemical
    ai_id: AI_MYCLOBUTANIL
    title: Triazole
    instructions: Resistance to single-site fungicides is well documented in this pathogen. Rotate FRAC
      groups every application.
    priority: 5
    evidence: extension_guideline
  diy:
  - diy_id: DIY_SQUASH_PM_BICARB
    title: Potassium bicarbonate spray
    ingredients:
    - item: potassium bicarbonate
      quantity: null
      unit: g
      home_available: true
    - item: horticultural or neem oil
      quantity: null
      unit: ml
      home_available: true
    - item: water
      quantity: 1
      unit: L
      home_available: true
    steps: Dissolve the bicarbonate fully, add the oil as a spreader, and spray both leaf surfaces to
      run-off in the early morning or evening. Repeat weekly.
    prep_time_hours: 0.25
    efficacy: mild_curative
    feasibility_score: 5
    safety_notes: Do not combine with sulfur. Spot-test on a few leaves first; some cultivars burn.
    evidence: extension_guideline
  - diy_id: DIY_SQUASH_PM_MILK
    title: Diluted milk spray
    ingredients:
    - item: milk
      quantity: 1
      unit: part
      home_available: true
    - item: water
      quantity: 9
      unit: part
      home_available: true
    steps: Mix and spray both leaf surfaces on a sunny morning; the effect appears to depend on light
      exposure. Repeat weekly.
    prep_time_hours: 0.1
    efficacy: preventive
    feasibility_score: 5
    safety_notes: Higher concentrations can leave an odorous surface film and encourage saprophytic growth.
    evidence: peer_reviewed
