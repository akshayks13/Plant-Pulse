- disease_id: D_APPLE_BLACK_ROT
  crop_id: apple
  pathogen_id: P_BOTRYOSPHAERIA_OBTUSA
  common_name: Black rot (frogeye leaf spot)
  curability: manageable
  severity_default: 3
  symptoms: Round leaf spots with purple margins and tan centres, giving the frogeye appearance. On fruit,
    a firm brown rot with concentric rings, usually starting at the calyx end. Sunken cankers with rough
    cracked bark on limbs.
  favorable_conditions: Warm humid weather; infection enters through wounds and dead or winter-injured
    wood.
  spread_mechanism: Spores from cankers and mummified fruit dispersed by rain.
  treatments:
  - control_class: cultural
    title: Prune out cankers and dead wood
    instructions: The fungus lives in dead wood. Remove cankered limbs and mummified fruit and destroy
      them; sanitation matters more here than spraying.
    priority: 1
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_CAPTAN
    title: Protectant fungicide
