    evidence: extension_guideline
- disease_id: D_ORANGE_HLB
  crop_id: orange
  pathogen_id: P_CLAS
  common_name: Huanglongbing (citrus greening)
  curability: incurable
  severity_default: 5
  symptoms: Blotchy asymmetric yellow mottling that does not mirror across the midrib - this asymmetry
    distinguishes it from a nutrient deficiency, which is symmetric. Yellow shoots, corky enlarged veins,
    small lopsided fruit that stay green at the bottom, bitter juice and heavy premature fruit drop.
  favorable_conditions: Presence of the Asian citrus psyllid. The tree declines regardless of weather
    once infected.
  spread_mechanism: Transmitted by the Asian citrus psyllid and by grafting infected budwood. Systemic
    and permanent.
  treatments:
  - control_class: cultural
    title: Report it - do not attempt home treatment
    instructions: There is no cure and no chemical will save an infected tree. HLB is regulated in many
      jurisdictions. Report a suspected case to the local agriculture department or horticulture officer
      and follow their instructions on removal.
    priority: 1
    evidence: extension_guideline
  - control_class: cultural
    title: Certified disease-free planting material
    instructions: Only plant nursery stock certified free of the pathogen. Grafting is a major transmission
      route.
    priority: 2
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_IMIDACLOPRID
    title: Psyllid vector suppression
    instructions: Area-wide vector management protects uninfected trees only. It does not treat an infected
      tree, and pollinator restrictions apply.
    priority: 3
    evidence: extension_guideline
- disease_id: D_GRAPE_BLACK_ROT
  crop_id: grape
  pathogen_id: P_GUIGNARDIA_BIDWELLII
  common_name: Black rot
  curability: manageable
  severity_default: 4
  symptoms: Circular tan leaf lesions with a dark border and a ring of tiny black pycnidia inside the
    spot. Berries develop a pale spot that rots the whole fruit within days, turning it into a hard black
    shrivelled mummy that clings to the cluster.
  favorable_conditions: Warm 20-27 C with rain; infection needs several hours of wetness.
  spread_mechanism: Ascospores and conidia released from overwintered mummies and cane lesions during
    spring rain.
  treatments:
  - control_class: cultural
    title: Remove mummies
    instructions: Every mummified berry left on the vine or ground is next season's inoculum. Removing
      them in winter is the single highest-value action.
    priority: 1
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_MANCOZEB
    title: Protectant fungicide
    instructions: Critical window runs from shoot growth through several weeks after bloom, when berries
      are susceptible.
    priority: 2
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_MYCLOBUTANIL
    title: Triazole
    instructions: Systemic with post-infection activity within a short window.
    priority: 3
    evidence: extension_guideline
- disease_id: D_GRAPE_ESCA
  crop_id: grape
  pathogen_id: P_ESCA_COMPLEX
  common_name: Esca (black measles)
  curability: incurable
  severity_default: 5
  symptoms: Tiger-stripe pattern on leaves - interveinal yellow or red chlorotic bands that dry to brown
    between green veins. Small dark spots on berries. In the apoplectic form an entire vine wilts and
    dies within days in hot weather. Cut trunk wood shows dark streaking and a spongy white rot.
  favorable_conditions: Large pruning wounds made in wet weather; older vines are far more affected.
  spread_mechanism: Spores enter through pruning wounds and colonise permanent trunk wood over years.
  treatments:
  - control_class: cultural
    title: No chemical cure exists - manage wounds
    instructions: The pathogens live in the trunk where no foliar spray reaches. Prune late in the dormant
      season during dry weather, make small cuts, and seal or treat large wounds. Remove and burn dead
      vines.
    priority: 1
    evidence: extension_guideline
  - control_class: biological
    ai_id: AI_TRICHODERMA
    title: Pruning wound protectant
    instructions: Applied to fresh cuts to competitively exclude trunk pathogens. Preventive only, on
      healthy wood.
    priority: 2
    evidence: peer_reviewed
  - control_class: physical
    title: Trunk renewal surgery
    instructions: Cutting back to clean wood and retraining a new trunk can prolong a valuable vine. Skilled
      work, not a home remedy.
    priority: 3
    evidence: extension_guideline
- disease_id: D_GRAPE_LEAF_BLIGHT
  crop_id: grape
  pathogen_id: P_PSEUDOCERCOSPORA_VITIS
  common_name: Leaf blight (Isariopsis leaf spot)
  curability: manageable
  severity_default: 3
  symptoms: Irregular dark brown to black angular spots on leaves, often merging into large blighted areas,
    with a sooty growth visible on the underside. Heavy infection causes premature leaf drop, weakening
    the vine for next season.
  favorable_conditions: Warm humid weather late in the season with a dense shaded canopy.
  spread_mechanism: Conidia from overwintered fallen leaves and canes.
  treatments:
  - control_class: cultural
    title: Canopy management and leaf removal
    instructions: Open the canopy for airflow and light penetration, and clear fallen leaves at the end
      of the season.
    priority: 1
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_MANCOZEB
    title: Protectant fungicide
    instructions: Late-season protectant coverage; often controlled incidentally by the black rot programme.
    priority: 2
    evidence: extension_guideline
- disease_id: D_APPLE_SCAB
  crop_id: apple
  pathogen_id: P_VENTURIA_INAEQUALIS
  common_name: Apple scab
  curability: manageable
  severity_default: 4
  symptoms: Olive-green velvety spots with feathery indistinct margins on leaves, which darken and turn
    the leaf yellow before it drops. Corky brown scabby lesions on fruit that crack as the fruit expands.
  favorable_conditions: Cool wet spring weather. Infection is driven by hours of leaf wetness at a given
    temperature (the Mills periods).
  spread_mechanism: Ascospores discharged from fallen leaves during spring rain, then secondary conidia
    through the season.
  treatments:
  - control_class: cultural
    title: Destroy fallen leaves
    instructions: Rake and remove or shred fallen leaves in autumn. Removing the overwintering leaf litter
      directly reduces the spring ascospore load.
