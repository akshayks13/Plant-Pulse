- disease_id: D_APPLE_CEDAR_RUST
  crop_id: apple
  pathogen_id: P_GYMNOSPORANGIUM_JV
  common_name: Cedar apple rust
  curability: manageable
  severity_default: 3
  symptoms: Bright yellow-orange spots on the upper leaf surface, often with a red border, developing
    small black dots in the centre. Beneath the spot, tube- like or hairy fringed structures protrude
    from the leaf underside - these are diagnostic and appear in no other apple disease.
  favorable_conditions: Spring rain, with a juniper or eastern red cedar host within a few hundred metres.
  spread_mechanism: Requires two hosts. Spores move from gelatinous orange galls on juniper to apple in
    spring, and back to juniper later.
  treatments:
  - control_class: cultural
    title: Remove nearby junipers
    instructions: The fungus cannot complete its life cycle without a juniper host. Removing junipers
      within a few hundred metres, or removing the orange galls before they swell in spring, ends the
      problem permanently.
    priority: 1
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_MYCLOBUTANIL
    title: Triazole
    instructions: Applied during the spring spore release window from pink bud through to a few weeks
      after petal fall. Later sprays are wasted.
    priority: 2
    evidence: extension_guideline
- disease_id: D_PEACH_BACTERIAL_SPOT
  crop_id: peach
  pathogen_id: P_XANTHOMONAS_PRUNI
  common_name: Bacterial spot
  curability: manageable
  severity_default: 4
  symptoms: Small angular purple-black leaf spots bounded by veins, whose centres often fall out to leave
    a ragged shot-hole. Heavy defoliation. Sunken pitted or cracked lesions on fruit skin.
  favorable_conditions: Warm wet windy weather; sandy exposed sites and wind-driven sand injury make it
    much worse.
  spread_mechanism: Overwinters in twig cankers and buds; spread by wind-driven rain.
  treatments:
  - control_class: cultural
    title: Site
    windbreaks and tolerant cultivars: null
    instructions: Cultivar tolerance varies enormously and is the main lever. Windbreaks reduce the leaf
      abrasion that lets bacteria in. Avoid excessive nitrogen.
    priority: 1
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_COPPER
    title: Dormant copper application
    instructions: Copper is used mainly in the dormant or delayed-dormant window; peach foliage is copper-sensitive
      and in-season applications risk phytotoxicity.
    priority: 2
    evidence: extension_guideline
- disease_id: D_CHERRY_POWDERY_MILDEW
  crop_id: cherry
  pathogen_id: P_PODOSPHAERA_CLANDESTINA
  common_name: Powdery mildew
  curability: curable
  severity_default: 3
  symptoms: White powdery patches on leaves, first on the underside and on succulent new shoots, with
    leaf curling and distortion. White fuzz on fruit and pedicels near harvest.
  favorable_conditions: Warm dry days with humid nights. Unlike most foliar fungi it does not need free
    water on the leaf, and rain actually suppresses it.
  spread_mechanism: Airborne conidia; overwinters as chasmothecia on bark and in bud scales.
  treatments:
  - control_class: cultural
    title: Prune for light and airflow
    instructions: Open the canopy, avoid excessive nitrogen that pushes soft susceptible growth, and remove
      infected suckers and watersprouts.
    priority: 1
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_SULFUR
    title: Sulfur
    instructions: Effective and inexpensive. Do not apply above roughly 30 C or within two weeks of an
      oil spray - both cause severe phytotoxicity.
    priority: 2
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_MYCLOBUTANIL
    title: Triazole
    instructions: Systemic; rotate FRAC groups, as powdery mildews develop resistance readily.
    priority: 3
    evidence: extension_guideline
