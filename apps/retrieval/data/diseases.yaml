      quantity: 1
      unit: ml
      home_available: true
    - item: water
      quantity: 1
      unit: L
      home_available: true
    steps: Mix 1 ml of soap solution into a little warm water. Add 15 ml of neem oil and stir hard until the mix
      turns milky. Top it up with water to make 1 litre. Spray both sides of the leaves in the evening. Shake the
      sprayer often and use the mix the same day, because the oil separates.
    prep_time_hours: 0.25
    efficacy: preventive
    feasibility_score: 4
    safety_notes: Do not spray in hot sun or above about 32 C, or within two weeks of a sulphur spray. Test on a
      few leaves first. Rinse the leaves well before eating them.
    evidence: anecdotal
    verified: false
    source_url: https://agritech.tnau.ac.in/itk/itk_crop_traditional_pesticides.html
- disease_id: D_PAPAYA_BLACK_SPOT
  crop_id: papaya
  pathogen_id: P_ASPERISPORIUM_CARICAE
  common_name: Black spot
  curability: manageable
  severity_default: 3
  symptoms: Small dark brown to black, slightly raised spots on the underside of older leaves, with pale or yellow
    areas on the upper surface. Heavily spotted leaves yellow and drop, and small round black spots can appear on
    the fruit skin.
  favorable_conditions: Warm humid weather with frequent rain.
  spread_mechanism: Airborne and rain-splashed spores from infected older leaves.
  look_alikes:
  - D_PAPAYA_LEAF_BLIGHT
  treatments:
  - control_class: cultural
    title: Remove older spotted leaves
    instructions: Cut off and destroy the lower, heavily spotted leaves to reduce the spore load.
    priority: 1
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_MANCOZEB
    title: Protectant fungicide spray
    instructions: Spray the leaf undersides as the label directs and respect the pre-harvest interval on fruit.
    priority: 2
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_COPPER
    title: Copper fungicide spray
    instructions: An alternative protectant for wet periods.
    priority: 3
    evidence: extension_guideline
  diy:
  - diy_id: DIY_PAPAYA_SPOT_BORDEAUX
    title: 1% Bordeaux mixture
    ingredients:
    - item: copper sulphate (blue crystals)
      quantity: 10
      unit: g
      home_available: false
    - item: lime (slaked lime / chuna)
      quantity: 10
      unit: g
      home_available: true
    - item: water for the copper sulphate
      quantity: 500
      unit: ml
      home_available: true
    - item: water for the lime
      quantity: 500
      unit: ml
      home_available: true
    steps: Dissolve 10 g of copper sulphate in 500 ml of water in a plastic, earthen or wooden container, never
      metal. Mix 10 g of lime into another 500 ml of water in a second container. Slowly pour the copper sulphate
      solution into the lime solution while stirring all the time. Dip a polished knife in the mixture for one minute
      and take it out. If the blade has a reddish-brown coating, stir in a little more lime and test again until
      the blade stays clean. Spray both sides of the leaves the same day, because the mixture does not keep.
    prep_time_hours: 0.5
    efficacy: preventive
    feasibility_score: 3
    safety_notes: Copper sulphate is poisonous if swallowed and irritates skin and eyes, so wear gloves, keep it
      away from children and pets, and never use kitchen utensils. Do not spray in cool, wet weather, when copper
      can scorch leaves.
    evidence: extension_guideline
    verified: false
    source_url: https://agritech.tnau.ac.in/horticulture/horti_pcrops_coconut_dis_mgnt.html
- disease_id: D_PAPAYA_LEAF_BLIGHT
  crop_id: papaya
  pathogen_id: P_PAPAYA_LEAF_BLIGHT
  common_name: Leaf blight
  curability: manageable
  severity_default: 4
  symptoms: Brown to dark brown irregular lesions, often starting at the leaf margin and tip, that expand and merge
    until large parts of the leaf dry up and look scorched. Larger lesions may show concentric rings.
  favorable_conditions: Warm humid weather with rain, poor airflow and stressed plants.
  spread_mechanism: Wind and rain-splashed spores from infected leaves and debris.
  look_alikes:
  - D_PAPAYA_BLACK_SPOT
  treatments:
  - control_class: cultural
    title: Remove blighted leaves and clear debris
    instructions: Cut off badly blighted leaves, clear fallen leaves, and avoid wetting the foliage.
    priority: 1
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_MANCOZEB
    title: Protectant fungicide spray
    instructions: Spray at the first lesions and after rain as the label directs.
    priority: 2
    evidence: extension_guideline
  - control_class: chemical
    ai_id: AI_AZOXYSTROBIN
    title: QoI strobilurin spray
    instructions: A rotation partner for the protectant. Never apply it twice in a row.
    priority: 3
    evidence: extension_guideline
